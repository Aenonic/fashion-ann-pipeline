stages:
  prepare:
    cmd: python3 src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/raw

  preprocess:
    cmd: python3 src/preprocess.py
    deps:
      - data/raw
      - src/preprocess.py
    params:
      - preprocess.test_size
      - preprocess.seed
    outs:
      - data/processed

  train:
    cmd: python3 src/train.py
    deps:
      - data/processed
      - src/train.py
    params:
      - train.batch_size
      - train.dense_units
      - train.dropout_rate
      - train.epochs
      - train.learning_rate
    outs:
      - models/history.csv
      - models/model.h5

  evaluate:
    cmd: python3 src/evaluate.py
    deps:
      - data/processed
      - models/model.h5
      - src/evaluate.py
    outs:
      - reports/confusion_matrix.png
    metrics:
      - metrics.json:
          cache: false
